name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build:
    name: Build ${{ matrix.arch }} ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64, arm64]
        config: [Release, Debug]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Map architecture variables
      id: archmap
      shell: pwsh
      run: |
        switch ("${{ matrix.arch }}") {
          "x86"   { $cpp = "Win32"; $rid = "win-x86";   $out = "x86" }
          "x64"   { $cpp = "x64";   $rid = "win-x64";   $out = "amd64" }
          "arm64" { $cpp = "ARM64"; $rid = "win-arm64"; $out = "arm64" }
        }
        "cpp_platform=$cpp" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "dotnet_rid=$rid" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "out_name=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "C++ platform: $cpp"
        Write-Host ".NET RID: $rid"
        Write-Host "Output name: $out"

    - name: Diagnostics - list repo structure
      shell: pwsh
      run: |
        Write-Host "=== Repo root ==="
        Get-ChildItem -Force | Select-Object Name, Mode | Format-Table -AutoSize
        Write-Host "=== .vcxproj files ==="
        Get-ChildItem -Recurse -Filter "*.vcxproj" | Select-Object FullName
        Write-Host "=== .csproj files ==="
        Get-ChildItem -Recurse -Filter "*.csproj" | Select-Object FullName
        Write-Host "=== MSBuild version ==="
        msbuild -version

    - name: Restore .NET packages
      shell: pwsh
      run: |
        $tools = @("ffuview", "ffuinfo", "exttools")
        foreach ($tool in $tools) {
          if (Test-Path "$tool\$tool.csproj") {
            Write-Host "Restoring $tool..."
            dotnet restore "$tool\$tool.csproj"
          }
        }

    - name: Build C++ tools (ffuext)
      continue-on-error: true
      shell: pwsh
      run: |
        $plat = "${{ steps.archmap.outputs.cpp_platform }}"
        $cfg = "${{ matrix.config }}"
        Write-Host "Building ffuext ($cfg, $plat)..."
        msbuild ffuext\ffuext.vcxproj /p:Configuration=$cfg /p:Platform=$plat /p:WindowsTargetPlatformVersion=10.0 /m /v:normal
        if ($LASTEXITCODE -ne 0) { Write-Host "::warning::ffuext build failed with exit code $LASTEXITCODE" }

    - name: Build C++ tools (wsktool)
      continue-on-error: true
      shell: pwsh
      run: |
        $plat = "${{ steps.archmap.outputs.cpp_platform }}"
        $cfg = "${{ matrix.config }}"
        Write-Host "Building wsktool ($cfg, $plat)..."
        msbuild wsktool\wsktool.vcxproj /p:Configuration=$cfg /p:Platform=$plat /p:WindowsTargetPlatformVersion=10.0 /m /v:normal
        if ($LASTEXITCODE -ne 0) { Write-Host "::warning::wsktool build failed with exit code $LASTEXITCODE" }

    - name: Build C++ tools (wcosstagetool)
      continue-on-error: true
      shell: pwsh
      run: |
        $plat = "${{ steps.archmap.outputs.cpp_platform }}"
        $cfg = "${{ matrix.config }}"
        Write-Host "Building wcosstagetool ($cfg, $plat)..."
        msbuild wcosstagetool\wcosstagetool.vcxproj /p:Configuration=$cfg /p:Platform=$plat /p:WindowsTargetPlatformVersion=10.0 /m /v:normal
        if ($LASTEXITCODE -ne 0) { Write-Host "::warning::wcosstagetool build failed with exit code $LASTEXITCODE" }

    - name: Publish .NET tools (self-contained)
      shell: pwsh
      run: |
        $rid = "${{ steps.archmap.outputs.dotnet_rid }}"
        $cfg = "${{ matrix.config }}"
        $out = "build\${{ steps.archmap.outputs.out_name }}\$cfg"
        $tools = @("ffuview", "ffuinfo", "exttools")
        foreach ($tool in $tools) {
          if (Test-Path "$tool\$tool.csproj") {
            Write-Host "Publishing $tool ($cfg, $rid)..."
            dotnet publish "$tool\$tool.csproj" -c $cfg -r $rid --self-contained true -o "$out\$tool"
            if ($LASTEXITCODE -ne 0) { Write-Host "::error::$tool publish failed" }
          } else {
            Write-Host "::warning::$tool.csproj not found"
          }
        }

    - name: Assemble output package
      shell: pwsh
      run: |
        $out = "build\${{ steps.archmap.outputs.out_name }}\${{ matrix.config }}"
        $plat = "${{ steps.archmap.outputs.cpp_platform }}"
        $cfg = "${{ matrix.config }}"
        if (!(Test-Path $out)) { New-Item -ItemType Directory -Force -Path $out | Out-Null }
        $cppTools = @("ffuext", "wsktool", "wcosstagetool")
        foreach ($tool in $cppTools) {
          $exe = "$tool\bin\$plat\$cfg\$tool.exe"
          if (Test-Path $exe) {
            Copy-Item $exe "$out\" -Force
            Write-Host "Copied: $exe"
          } else {
            Write-Host "::warning::$exe not found"
          }
          $pdb = "$tool\bin\$plat\$cfg\$tool.pdb"
          if (Test-Path $pdb) { Copy-Item $pdb "$out\" -Force }
        }
        if (Test-Path "language") {
          if (!(Test-Path "$out\language")) { New-Item -ItemType Directory -Force -Path "$out\language" | Out-Null }
          Copy-Item "language\*.dll" "$out\language\" -Force -ErrorAction SilentlyContinue
          Write-Host "Copied language DLLs: $((Get-ChildItem "$out\language" -Filter '*.dll').Count)"
        }
        Copy-Item "LICENSE" "$out\" -Force -ErrorAction SilentlyContinue
        Copy-Item "README.md" "$out\" -Force -ErrorAction SilentlyContinue
        Write-Host "=== Output contents ==="
        Get-ChildItem $out -Recurse | Select-Object @{N='Path';E={$_.FullName.Replace((Get-Location).Path + '\', '')}}, @{N='SizeKB';E={if(!$_.PSIsContainer){[math]::Round($_.Length/1KB,1)}}} | Format-Table -AutoSize

    - name: Package as ZIP
      shell: pwsh
      run: |
        $out = "build\${{ steps.archmap.outputs.out_name }}\${{ matrix.config }}"
        $zip = "WSK_Tools_${{ steps.archmap.outputs.out_name }}_${{ matrix.config }}.zip"
        if (Test-Path $out) {
          Compress-Archive -Path "$out\*" -DestinationPath $zip -Force
          Write-Host "Created: $zip"
          Get-Item $zip | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}
        } else {
          Write-Host "::error::Output directory not found: $out"
          exit 1
        }

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: WSK_Tools_${{ steps.archmap.outputs.out_name }}_${{ matrix.config }}
        path: WSK_Tools_${{ steps.archmap.outputs.out_name }}_${{ matrix.config }}.zip
        retention-days: 30

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: |
        find artifacts -name "*.zip" -exec ls -lh {} \;

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: WSK_Tools ${{ github.ref_name }}
        body: |
          ## WSK_Tools ${{ github.ref_name }}

          支持架构：x86 / amd64 / arm64
          配置：Release / Debug
          .NET 工具为自包含部署，无需安装 .NET 运行时。

          ### 包含工具
          - **ffuext** — FFU 释放工具
          - **wsktool** — WSK 构建工具
          - **wcosstagetool** — WCOS 阶段工具
          - **ffuview** — FFU 镜像分区与文件浏览器（GUI）
          - **ffuinfo** — FFU 结构分析工具（命令行）
          - **exttools** — FFU/VHDX 进阶诊断工具集（命令行）

          ### 多语言
          支持 6 种语言：简体中文、繁體中文、English、日本語、Русский、한국어

          ### 许可证
          MIT License
        files: artifacts/**/*.zip
        draft: false
        prerelease: false
